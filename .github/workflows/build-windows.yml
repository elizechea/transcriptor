name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Compilar Transcriptor.exe
        run: pyinstaller --noconfirm --clean Transcriptor.spec

      - name: Probar el .exe (dependencias + transcripción con modelo tiny)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Transcriptor.exe `
                -ArgumentList "--self-test","--model","tiny","--report","selftest.txt" `
                -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "El autotest del ejecutable ha fallado ($($p.ExitCode))" }
          "Tamaño: {0:N0} MB" -f ((Get-Item dist\Transcriptor.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Transcriptor-windows
          path: dist/Transcriptor.exe
          if-no-files-found: error

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Transcriptor.exe
